# push(dev·main)·PR(main)마다 품질 게이트를 자동 실행한다.
# 배포 시점 게이트는 publish.yml(v태그) — 이 워크플로는 pre-merge/push 게이트로 보완한다.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # CI는 check-only — 로컬 lint(--fix)와 달리 자동수정 없이 위반을 실패시킨다.
      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # vitest — MCP 단위 + e2e 포함(동봉 data/history.sqlite.gz git-tracked).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
