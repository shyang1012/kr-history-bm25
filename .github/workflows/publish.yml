# v* 태그가 push 되면 npm 에 자동 배포한다.
# /배포 워크플로우가 main 머지 후 v 태그를 만들어 push → 이 워크플로우 trigger.
# npm Trusted Publisher(OIDC)로 토큰 없이 publish (provenance 포함).

name: Publish to npm (OIDC)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급 (Trusted Publisher)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # OIDC Trusted Publisher 는 npm 11.5.1+ 필요.
      # npm@latest(12.x)는 provenance용 sigstore 번들 회귀(npm/cli#9722)라 최신 11.x로 고정한다.
      - run: npm install -g npm@11

      - run: npm ci

      # 빌드 (동봉 코퍼스·벡터는 커밋된 data/history.sqlite.gz 사용, 재생성 불요)
      - run: npm run build

      # 동봉 임베딩 모델 확보 — models/ 는 118MB라 git 제외(checkout에 없음)이므로 배포 전 내려받아
      # npm 패키지 files("models")에 포함되게 한다. 이 단계로 의미검색 e2e도 CI에서 실검증된다(F-03 오프라인 로드).
      - run: node scripts/fetch-model.mjs

      - run: npm test

      # Trusted Publisher → NODE_AUTH_TOKEN 불필요. provenance 포함 publish.
      - run: npm publish --provenance --access public
